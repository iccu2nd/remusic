<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="description" content="ReMusic - Modern YouTube Music Player with Glass UI & Synced Lyrics" />
  <title>ReMusic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23a78bfa'/%3E%3Cstop offset='100%25' stop-color='%23c084fc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0f'/%3E%3Ccircle cx='32' cy='38' r='12' fill='none' stroke='url(%23g)' stroke-width='4'/%3E%3Cpath d='M40 14v24' stroke='url(%23g)' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M40 14c6 0 10 3 10 8' stroke='url(%23g)' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app" id="app">
    <!-- Ambient Background -->
    <div class="ambient" id="ambient"></div>

    <!-- Top Header -->
    <header class="header glass">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 40 40" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:28px;height:28px;flex-shrink:0">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#a78bfa"/>
              <stop offset="100%" stop-color="#c084fc"/>
            </linearGradient>
          </defs>
          <circle cx="18" cy="26" r="8" stroke="url(#logoGrad)" stroke-width="2.5" fill="none"/>
          <path d="M24 10v16" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M24 10c4.5 0 7.5 2.2 7.5 6" stroke="url(#logoGrad)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="logo-text">ReMusic</span>
      </div>
      <div class="search-wrap">
        <div class="search-box glass">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;flex-shrink:0">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Cari lagu, artis..." autocomplete="off" />
          <button id="clearSearch" class="clear-btn" style="display:none">✕</button>
        </div>
        <div id="suggestions" class="suggestions glass"></div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main" id="main">
      <!-- HOME VIEW -->
      <section id="homeView" class="view active">
        <div class="section-header">
          <h2>Untuk Kamu</h2>
          <button class="refresh-btn glass" id="refreshBtn" title="Refresh">↻</button>
        </div>
        <div id="recommendedGrid" class="grid"></div>
      </section>

      <!-- SEARCH VIEW -->
      <section id="searchView" class="view">
        <div class="section-header">
          <h2>Hasil Pencarian</h2>
        </div>
        <div id="searchResults" class="grid"></div>
      </section>

      <!-- LYRICS VIEW -->
      <section id="lyricsView" class="view">
        <div class="lyrics-header">
          <img id="lyricsThumb" class="lyrics-thumb" src="" alt="" />
          <div>
            <div id="lyricsTitle" class="lyrics-title">—</div>
            <div id="lyricsArtist" class="lyrics-artist">—</div>
          </div>
        </div>
        <div id="lyricsContainer" class="lyrics-body">
          <div class="lyrics-placeholder">Pilih lagu untuk melihat lirik tersinkron ✨</div>
        </div>
      </section>

      <!-- QUEUE VIEW -->
      <section id="queueView" class="view">
        <div class="section-header">
          <h2>Antrian</h2>
          <span id="queueCount" class="badge">0</span>
        </div>
        <div id="queueList" class="queue-list"></div>
      </section>
    </main>

    <!-- Mini Player (when not expanded) -->
    <div class="mini-player glass" id="miniPlayer">
      <img id="miniThumb" class="mini-thumb" src="" alt="" />
      <div class="mini-info">
        <div id="miniTitle" class="mini-title">Belum ada lagu</div>
        <div id="miniArtist" class="mini-artist">Ketuk untuk play</div>
      </div>
      <button id="miniPlayBtn" class="mini-play">▶</button>
    </div>

    <!-- Full Player Sheet -->
    <div class="player-sheet glass" id="playerSheet">
      <div class="sheet-handle"></div>
      <div class="player-content">
        <img id="fullThumb" class="full-thumb" src="" alt="" />
        <div class="full-info">
          <h3 id="fullTitle">—</h3>
          <p id="fullArtist">—</p>
        </div>

        <div class="progress-wrap">
          <input type="range" id="progressBar" min="0" max="1000" value="0" />
          <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button id="shuffleBtn" class="ctrl-btn" title="Shuffle">⇄</button>
          <button id="prevBtn" class="ctrl-btn" title="Previous">⏮</button>
          <button id="playPauseBtn" class="play-btn" title="Play/Pause">▶</button>
          <button id="nextBtn" class="ctrl-btn" title="Next">⏭</button>
          <button id="repeatBtn" class="ctrl-btn" title="Repeat">⟳</button>
        </div>

        <div class="extra-controls">
          <button id="lyricsBtn" class="extra-btn">📝 Lirik</button>
          <button id="queueBtn" class="extra-btn">☰ Antrian</button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav glass">
      <button class="nav-item active" data-view="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-view="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <span>Cari</span>
      </button>
      <button class="nav-item" data-view="lyrics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>Lirik</span>
      </button>
      <button class="nav-item" data-view="queue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Antrian</span>
      </button>
    </nav>
  </div>

  <!-- Hidden YT Player -->
  <div id="ytPlayer"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/app.js"></script>
</body>
</html>
