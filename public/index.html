<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>ReMusic</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121212'/%3E%3Ccircle cx='28' cy='38' r='10' fill='none' stroke='%231ed760' stroke-width='4'/%3E%3Cpath d='M36 12v26' stroke='%231ed760' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-top">
        <div class="logo">
          <div class="logo-mark"><i class="fa-solid fa-play"></i></div>
          <div>
            <div class="logo-text">ReMusic</div>
            <div class="logo-sub" id="greeting">Halo</div>
          </div>
        </div>
        <button class="h-btn" id="refreshBtn" aria-label="Refresh"><i class="fa-solid fa-arrows-rotate"></i></button>
      </div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Apa yang ingin kamu dengarkan?" autocomplete="off" />
        <button id="clearSearch" class="clear-btn" hidden><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="suggestions" class="suggestions"></div>
      <div class="chips" id="moodChips">
        <button class="chip active" data-q="trending music">Semua</button>
        <button class="chip" data-q="chill acoustic songs">Santai</button>
        <button class="chip" data-q="sleep calm music">Tidur</button>
        <button class="chip" data-q="upbeat energetic songs">Energik</button>
        <button class="chip" data-q="sad emotional songs">Sedih</button>
        <button class="chip" data-q="romantic love songs">Romantis</button>
      </div>
    </header>

    <main class="main" id="main">
      <section id="homeView" class="view active">
        <div class="section">
          <h2 class="sec-title">Pilihan cepat</h2>
          <div class="h-scroll" id="quickPicks"></div>
        </div>
        <div class="section">
          <h2 class="sec-title">Trending sekarang</h2>
          <div class="h-scroll" id="trendingRow"></div>
        </div>
        <div class="section">
          <h2 class="sec-title">Populer</h2>
          <div class="h-scroll" id="popularRow"></div>
        </div>
      </section>

      <section id="searchView" class="view">
        <h2 class="sec-title">Hasil pencarian</h2>
        <div id="searchResults" class="v-list"></div>
      </section>

      <section id="lyricsView" class="view">
        <div class="lyrics-head">
          <img id="lyricsThumb" src="" alt="" />
          <div class="lyrics-meta">
            <div id="lyricsTitle" class="lyrics-title">—</div>
            <div id="lyricsArtist" class="lyrics-artist">—</div>
          </div>
        </div>
        <div id="lyricsContainer" class="lyrics-body">
          <div class="empty">Pilih lagu untuk melihat lirik</div>
        </div>
      </section>

      <section id="queueView" class="view">
        <div class="sec-head-row">
          <h2 class="sec-title">Antrian</h2>
          <span id="queueCount" class="badge">0</span>
        </div>
        <div id="queueList" class="v-list"></div>
      </section>
    </main>

    <div class="mini-player" id="miniPlayer" hidden>
      <img id="miniThumb" src="" alt="" />
      <div class="mini-info">
        <div id="miniTitle">—</div>
        <div id="miniArtist">—</div>
      </div>
      <button id="miniPlayBtn" class="mp-btn" aria-label="Play"><i class="fa-solid fa-play"></i></button>
    </div>

    <div class="player-modal" id="playerModal">
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="full-art-wrap">
          <img id="fullThumb" class="full-thumb" src="" alt="" />
        </div>
        <div class="full-info">
          <h3 id="fullTitle">—</h3>
          <p id="fullArtist">—</p>
        </div>
        <div class="progress-wrap">
          <input type="range" id="progressBar" min="0" max="1000" value="0" />
          <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>
        <div class="controls">
          <button id="shuffleBtn" class="ctrl" aria-label="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
          <button id="prevBtn" class="ctrl" aria-label="Previous"><i class="fa-solid fa-backward-step"></i></button>
          <button id="playPauseBtn" class="play-main" aria-label="Play"><i class="fa-solid fa-play"></i></button>
          <button id="nextBtn" class="ctrl" aria-label="Next"><i class="fa-solid fa-forward-step"></i></button>
          <button id="repeatBtn" class="ctrl" aria-label="Repeat"><i class="fa-solid fa-repeat"></i></button>
        </div>
        <div class="extra-row">
          <button id="lyricsBtn" class="extra-btn"><i class="fa-solid fa-microphone-lines"></i> Lirik</button>
          <button id="queueBtn" class="extra-btn"><i class="fa-solid fa-list-ul"></i> Antrian</button>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home"><i class="fa-solid fa-house"></i><span>Beranda</span></button>
      <button class="nav-item" data-view="search"><i class="fa-solid fa-magnifying-glass"></i><span>Cari</span></button>
      <button class="nav-item" data-view="lyrics"><i class="fa-solid fa-microphone-lines"></i><span>Lirik</span></button>
      <button class="nav-item" data-view="queue"><i class="fa-solid fa-list-ul"></i><span>Antrian</span></button>
    </nav>
  </div>

  <div id="ytPlayer"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/app.js"></script>
</body>
</html>
